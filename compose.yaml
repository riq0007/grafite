# Ambiente de desenvolvimento. As senhas vêm do .env (nunca versionado); sem padrão embutido.
name: grafite

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${GRAFITE_DB_SUPERUSER_PASSWORD:?defina GRAFITE_DB_SUPERUSER_PASSWORD no .env}
      POSTGRES_DB: grafite
      GRAFITE_DB_OWNER_PASSWORD: ${GRAFITE_DB_OWNER_PASSWORD:?defina GRAFITE_DB_OWNER_PASSWORD no .env}
      GRAFITE_DB_APP_PASSWORD: ${GRAFITE_DB_APP_PASSWORD:?defina GRAFITE_DB_APP_PASSWORD no .env}
      GRAFITE_DB_BACKUP_PASSWORD: ${GRAFITE_DB_BACKUP_PASSWORD:?defina GRAFITE_DB_BACKUP_PASSWORD no .env}
    ports:
      - "${GRAFITE_DB_PORT:?defina GRAFITE_DB_PORT no .env}:5432"
    volumes:
      - dados-db:/var/lib/postgresql
      - ./packages/db/docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d grafite"]
      interval: 2s
      timeout: 3s
      retries: 30

  # O e-mail do desenvolvimento (change p3c-email-e-push): o Mailpit guarda o que a API manda, sem
  # entregar a ninguém, e o mostra em http://localhost:8025. Só no próprio computador.
  email:
    image: axllent/mailpit:v1.24.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  dados-db:
