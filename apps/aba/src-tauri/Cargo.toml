[package]
name = "grafite-aba"
description = "A aba dos colaboradores no Windows"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "grafite_aba"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-global-shortcut = "2.4.1"
grafite-aba-pipe = { path = "../pipe" }
# O estado e os eventos da API pelo native-tls, o schannel do Windows (decisão 10), no runtime do Tauri.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["macros", "sync", "time"] }

# O ponteiro, o foco, o tema, a apresentação e os avisos da troca da tela e dos ajustes, que o Tauri
# não passa adiante (design, decisão 7), o DPAPI da pessoa, que guarda o token da sessão, e o aviso da
# tela bloqueada e da saída do Windows, que terminam a sessão pela senha. A mesma
# versão que o Tauri usa, para o HWND dele servir aqui.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Registry",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
