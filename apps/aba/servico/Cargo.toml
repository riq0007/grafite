[package]
name = "grafite-aba-servico"
description = "O serviço do Windows da aba: guarda o token do aparelho e atende a aba pelo pipe"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "grafite-aba-servico"
path = "src/main.rs"

# O reqwest com o native-tls, o schannel do Windows: vale a autoridade interna da empresa (decisão 10).
[dependencies]
grafite-aba-pipe = { path = "../pipe" }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# O serviço, o registro, o DPAPI da máquina e a segurança das pastas (design, decisão 1). A mesma
# versão do `windows` que o Tauri usa.
[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
] }
