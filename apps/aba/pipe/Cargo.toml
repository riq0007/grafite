[package]
name = "grafite-aba-pipe"
description = "O pipe local entre a aba e o serviço do Windows: o servidor, o cliente que confere o serviço e quem chama"
version.workspace = true
edition.workspace = true
publish.workspace = true

# As mensagens do pipe em JSON, as mesmas dos dois lados.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.154"

# O pipe, a segurança e o gerenciador de serviços do Windows (design, decisão 1). A mesma versão que o
# Tauri usa.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Services",
  "Win32_System_Threading",
] }
